<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ThreeBrowser Studio</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b1018;
      color: #dce8f7;
      font: 15px/1.45 "Segoe UI", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0b1018;
    }
    #boot[hidden] { display: none; }
    #boot p { margin: 0; max-width: 28rem; color: #9fb1c6; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js"
    }
  }
  </script>
</head>
<body>
  <div id="boot"><p>Starting ThreeBrowser Studio…</p></div>
  <script type="module">
    const boot = document.getElementById("boot");
    try {
      if (!navigator.gpu) {
        throw new Error("This browser has no WebGPU. Use Chrome/Edge with WebGPU, or the desktop ThreeBrowser Studio host.");
      }
      await import("./pages/browser-entry.mjs?v=prompt-14");
      boot.hidden = true;
    } catch (error) {
      boot.hidden = false;
      boot.querySelector("p").textContent = error instanceof Error ? error.message : String(error);
      console.error("[ThreeBrowser Studio]", error);
    }
  </script>
</body>
</html>
